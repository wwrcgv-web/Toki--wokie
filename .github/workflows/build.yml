name: Build APK

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Numéro de version dans le code
        run: sed -i "s/APP_BUILD = 0/APP_BUILD = ${{ github.run_number }}/" $(find . -name MainActivity.java)
      - name: Build with Gradle
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/*.apk'
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Toki Walkie ${{ github.run_number }}
          files: '**/*.apk'
